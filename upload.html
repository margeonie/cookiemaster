<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datensammelpass hochladen</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="upload">
    <header class="topbar">
      <h1>Datensammelpass</h1>
    </header>

    <main class="container app-shell">
      <div class="overview-actions">
        <a href="index.html" class="action-link">← Zurück</a>
      </div>

      <section class="upload-panel upload-page" aria-label="Datensammelpass verarbeiten">
        <h2>Passverarbeitung</h2>
        <p>
          Die Auswertung des Datensammelpasses erfolgt außerhalb der Web-App über das Skript
          <code>generate_freigaben.py</code>. Danach wird die erzeugte <code>freigaben.json</code>
          für die Anzeige in der App verwendet.
        </p>
      </section>
    </main>
  </body>
