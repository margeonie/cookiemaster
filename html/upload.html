<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datensammelpässe hochladen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="upload">
    <header class="topbar detail-header">
      <a href="index.html" class="back-link">← Zur Übersicht</a>
    </header>

    <main class="container app-shell">
      <div class="status-row">
        <div id="status" class="status-bar status-empty" aria-live="polite">
          Datensammelpass wird geladen…
        </div>
      </div>

      <section class="upload-panel" aria-label="Datensammelpässe auswerten">
        <div class="upload-grid">
          <label class="file-input-wrap file-input-green">
            <span>Grüner Datensammelpass</span>
            <input id="pass-gruen" type="file" accept="image/*" />
          </label>
          <label class="file-input-wrap file-input-orange">
            <span>Oranger Datensammelpass</span>
            <input id="pass-orange" type="file" accept="image/*" />
          </label>
          <button id="load-freigaben" class="primary-button" type="button">Laden</button>
        </div>
        <section id="scan-review" class="scan-review" aria-labelledby="scan-review-title" hidden>
          <h2 id="scan-review-title">Erkannte Kreuze prüfen und freigeben</h2>
          <div id="scan-review-tables" class="scan-review-tables"></div>
          <div class="review-actions">
            <p id="review-summary" class="review-summary" aria-live="polite"></p>
            <button id="review-reset" class="secondary-button" type="button">Zurücksetzen</button>
            <button id="release-freigaben" class="primary-button" type="button">Daten freigeben</button>
          </div>
        </section>
      </section>
    </main>

    <script src="../pass-scanner.js"></script>
    <script src="../review-state.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
