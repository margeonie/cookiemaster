<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persona Details</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../chat.css" />
  </head>
  <body data-page="detail">
    <header class="topbar detail-header">
      <a href="index.html" class="back-link">← Zurück</a>

    <main class="container app-shell">
      <div class="status-row">
        <div id="status" class="status-bar status-empty" aria-live="polite">

        </div>
      </div>

      <article id="detail-card" class="detail-card" aria-live="polite"></article>

    <div
      id="persona-chat-overlay"
      class="chat-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Phishing-Nachrichten"
      hidden

      <div class="chat-demo">
        <section id="persona-chat" aria-label="Phishing-Chat"></section>
      </div>
    </div>

    <script src="../script.js"></script>
    <script src="../chat.js"></script>
