<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wer ist wohl am anfälligsten für Phishing?</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="overview">
    <header class="topbar">
      <h1>Wer ist wohl am anfälligsten für Phishing?</h1>
    </header>

    <main class="container app-shell">
      <div class="status-row">
        <div id="status" class="status-bar status-empty" aria-live="polite">
          Datensammelpass wird geladen…
        </div>
      </div>

      <section class="upload-panel" aria-label="Datensammelpässe auswerten">
        <div class="upload-grid">
          <label class="file-input-wrap file-input-green">
            <span>Grüner Datensammelpass</span>
            <input id="pass-gruen" type="file" accept="image/*" />
          </label>
          <label class="file-input-wrap file-input-orange">
            <span>Oranger Datensammelpass</span>
            <input id="pass-orange" type="file" accept="image/*" />
          </label>
          <button id="load-freigaben" class="primary-button" type="button">Laden</button>
        </div>
        <details id="scan-review" class="scan-review" hidden>
          <summary>Erkannte Kreuze prüfen</summary>
          <div id="scan-review-tables" class="scan-review-tables"></div>
        </details>
      </section>

      <div class="overview-controls">
        <label class="persona-filter">
          <span>Personas anzeigen</span>
          <select id="persona-color-filter" aria-label="Personas nach Farbe filtern">
            <option value="alle">Alle</option>
            <option value="grün">Nur Grün</option>
            <option value="orange">Nur Orange</option>
          </select>
        </label>
        <div class="overview-buttons">
          <button id="reset-freigaben" class="secondary-button" type="button">Reset</button>
        </div>
      </div>

      <div id="persona-list" class="persona-grid" aria-live="polite"></div>
    </main>

    <script src="../pass-scanner.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
